{% extends "base.html" %}
{% block content %}
<div class="page">
  <form method="POST" action="{{ url_for('profile') }}">
    <div class="title-row">
      <div>
        <h2>Profile</h2>
        <div class="muted">Manage your personal and professional information.</div>
      </div>
      <button class="btn primary" type="submit">Save Changes</button>
    </div>

    <div class="profile-grid">
      <div class="card" style="text-align:center">
        <div class="avatar"></div>
        <h3>{{ profile.name }}</h3>
        <p class="muted">{{ profile.role }}</p>
        <div class="notice">Profile completion <b>{{ profile.completion }}%</b></div>
      </div>
      <div class="card">
        <h3>Personal Information</h3>
        <div class="grid grid2">
          {% for f in profile.fields %}
          <div class="field">
            <label>{{ f.label }}</label>
            <input class="input" name="{{ f.label }}" value="{{ f.value }}">
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %}
